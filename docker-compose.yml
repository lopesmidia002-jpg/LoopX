services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loopx-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://loopx:loopx_password@postgres:5432/loopx_db?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_AI_STUDIO_API_KEY=${GOOGLE_AI_STUDIO_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - loopx-network

  postgres:
    image: postgres:16-alpine
    container_name: loopx-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=loopx
      - POSTGRES_PASSWORD=loopx_password
      - POSTGRES_DB=loopx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U loopx -d loopx_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - loopx-network

  redis:
    image: redis:7-alpine
    container_name: loopx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - loopx-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  loopx-network:
    driver: bridge
